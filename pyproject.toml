[tool.ruff]
line-length = 100
# CI (ci.yml) runs Python 3.11.
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","UP"]

[tool.ruff.lint.per-file-ignores]
# G17 run_catalog surface: run_catalog.py and run_plain_tests.py are ported
# byte-identical from StegVerse-Labs/StegDB @eab2e773 and pinned by sha256,
# and the registry test is the generated G17 contract test, so their line
# length is not reflowed here. Every other rule still applies to them.
"tools/tasks/run_catalog.py" = ["E501"]
"tools/tasks/run_plain_tests.py" = ["E501"]
"tests/test_workflow_surface_registry.py" = ["E501"]

[tool.pytest.ini_options]
# scripts/ holds runnable helpers (for example scripts/enqueue_test.py, a Redis job producer), not tests.
testpaths = ["tests"]
# Tests import repo packages (engine, scripts, tools) from the repository root; make it
# importable for the plain `pytest` entry point used by ci.yml and ci_governance.yml.
pythonpath = ["."]
