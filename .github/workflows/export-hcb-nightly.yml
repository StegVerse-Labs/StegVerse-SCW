name: export-hcb-nightly

on:
  schedule:
    - cron: "15 3 * * *"   # daily at 03:15 UTC
  workflow_dispatch: {}    # allow manual run of the nightly profile

permissions:
  actions: write
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dry-run HCB export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run export-hcb.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f repos_csv="StegVerse/hybrid-collab-bridge" \
            -f export_branch="main" \
            -f sync_mode="mirror" \
            -f push_strategy="direct" \
            -f version_tag="v1.2-nightly" \
            -f dry_run="true" \
            -f tag_repo="false" \
            -f release_create="false"
