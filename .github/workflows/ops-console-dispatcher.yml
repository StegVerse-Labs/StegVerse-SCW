name: Ops Console Dispatcher

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      workflow:
        description: "Workflow file (e.g., autopatch-apply.yml)"
        required: true
      ref:
        description: "Ref (default main)"
        required: false
        default: "main"
      inputs_json:
        description: "Inputs JSON"
        required: false
        default: "{}"

permissions:
  contents: read
  issues: read

jobs:
  dispatch_request_evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Derive requested parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ github.event_name }}"
          WF=""; REF="main"; INPUTS="{}"

          if [ "$MODE" = "issues" ]; then
            BODY='${{ github.event.issue.body }}'
            WF=$(printf "%s\n" "$BODY" | awk '/Select workflow to run/{getline; print}' | xargs || true)
            REF_LINE=$(printf "%s\n" "$BODY" | awk '/Branch\/Ref/{getline; print}' | xargs || true)
            [ -n "$REF_LINE" ] && REF="$REF_LINE"
            INPUTS=$(printf "%s\n" "$BODY" | awk '/Inputs JSON/{getline; print}' | sed 's/^\x60\x60\x60//; s/\x60\x60\x60$//' | xargs || true)
            [ -z "$INPUTS" ] && INPUTS="{}"
          elif [ "$MODE" = "issue_comment" ]; then
            CMT='${{ github.event.comment.body }}'
            if echo "$CMT" | grep -qE '^/run[[:space:]]+'; then
              WF=$(echo "$CMT" | sed -n 's#^/run[[:space:]]\+\([^[:space:]]\+\).*#\1#p')
              JSON=$(echo "$CMT" | sed -n 's#^/run[[:space:]]\+[^[:space:]]\+[[:space:]]\+\(.*\)$#\1#p')
              [ -n "$JSON" ] && INPUTS="$JSON"
            fi
          else
            WF='${{ inputs.workflow }}'
            REF='${{ inputs.ref }}'
            INPUTS='${{ inputs.inputs_json }}'
          fi

          echo "wf=$WF" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "inputs=$INPUTS" >> "$GITHUB_OUTPUT"

      - name: Record bounded dispatch-request evidence
        run: |
          set -euo pipefail
          mkdir -p ops-console-evidence
          {
            echo "event=${{ github.event_name }}"
            echo "workflow=${{ steps.params.outputs.wf }}"
            echo "ref=${{ steps.params.outputs.ref }}"
            echo "inputs=${{ steps.params.outputs.inputs }}"
            if [ -n "${{ steps.params.outputs.wf }}" ]; then
              echo "state=REQUEST_OBSERVED_NOT_DISPATCHED"
            else
              echo "state=NO_DISPATCH_REQUEST"
            fi
            echo "github_runtime_authority=VALIDATION_EVIDENCE_ONLY"
            echo "authority_effect=NONE"
          } | tee ops-console-evidence/request.txt

      - name: Upload request evidence
        uses: actions/upload-artifact@v4
        with:
          name: ops-console-request-${{ github.run_id }}
          path: ops-console-evidence/request.txt
          if-no-files-found: error
          retention-days: 14
