name: StegVerse Multi-Repo Autopatch [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: read

concurrency:
  group: stegverse-multi-autopatch-main
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy cross-repository mutation authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Scheduled multi-repository autopatch is contained because its PAT fallback/global bearer-token rewrite and direct pushes do not satisfy the bounded TV/TVC authority contract."
          echo "Do not restore mutation until TV/TVC supplies admitted execution authority with exact provenance and bounded target scope."
          exit 1
