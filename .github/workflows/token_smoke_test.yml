name: Token Smoke Test [RETIRED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Block direct generic credential exercise
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This smoke test is retired because it directly injected and exercised a non-TV/TVC credential against GitHub identity and organization repository APIs."
          echo "Credential health checks must execute inside TV/TVC and emit only secret-free status evidence. See SCW issue #22."
          exit 1
