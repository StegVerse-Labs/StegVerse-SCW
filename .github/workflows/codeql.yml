name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        id: codeql_analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:python"

      - name: Report CodeQL analysis posture
        if: always()
        run: |
          if [ "${{ steps.codeql_analysis.outcome }}" = "success" ]; then
            echo "CodeQL analysis completed successfully."
          else
            echo "::warning::CodeQL analysis could not publish results. Repository code-scanning configuration requires separate review."
          fi
