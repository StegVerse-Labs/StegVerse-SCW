name: StegVerse Guardian – Workflows Health & Hygiene [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block PAT-backed workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Guardian workflow auto-fix is contained because PAT fallback/global credential rewriting and direct workflow pushes are outside admitted TV/TVC repair authority."
          echo "Retain analysis as evidence-only; mutate only under a bounded TV/TVC repair decision. See SCW issue #22."
          exit 1
