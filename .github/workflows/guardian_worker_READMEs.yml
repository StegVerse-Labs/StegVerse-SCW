name: StegVerse Guardian Worker - READMEs [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy documentation mutation authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Guardian README mutation is contained because the previous PAT-backed job generated and directly pushed repository content."
          echo "Documentation generation may be validated as evidence; durable mutation requires admitted TV/TVC authority. See SCW issue #22."
          exit 1
