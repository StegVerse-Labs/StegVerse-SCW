name: StegTV Connectivity Autopatch [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy cross-repository mutation path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy workflow is contained because it used a generic PAT for cross-repository cloning, direct commits, and pushes under GitHub-hosted authority."
          echo "TVC source reads and any downstream mutations must use separately admitted, bounded TV/TVC capabilities with target/ref evidence."
          echo "See SCW issue #22."
          exit 1
