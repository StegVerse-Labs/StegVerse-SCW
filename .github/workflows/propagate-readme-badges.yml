name: propagate-readme-badges — CONTAINED

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy credential-bearing propagation
        run: |
          set -euo pipefail
          test -z "${STEGVERSE_BOT_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          echo "::error::Legacy README/badge propagation is contained because it used non-TV/TVC bearer credentials and propagated a scheduled write-authority workflow into target repositories."
          echo "Replacement requires explicit TV/TVC target-scoped mutation grants and must not propagate autonomous hosted write authority as a side effect."
          exit 1
