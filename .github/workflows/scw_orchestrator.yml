name: StegVerse SCW Orchestrator [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy SCW mutation/control authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::SCW orchestrator is contained because the prior workflow combined generic non-TV/TVC credential access with contents/PR/issues write authority and repository-dispatch command execution."
          echo "Reactivation requires bounded TV/TVC route and mutation authority with exact target/ref provenance; GitHub Actions remains validation/transport only. See SCW issue #22."
          exit 1
