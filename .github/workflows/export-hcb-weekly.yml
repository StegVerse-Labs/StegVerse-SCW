name: export-hcb-weekly — CONTAINED

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy scheduled real-export authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Weekly HCB export is contained because the historical workflow inherited secrets, held repository write permissions, and requested a non-dry-run cross-repository export."
          echo "The retained export-hcb.yml target is itself contained. Any future export requires separately admitted TV/TVC source-read and mutation authority with exact source/target refs and secret-free receipts."
          exit 1
