name: StegTV Connectivity Autopatch [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch:
  schedule:
    - cron: "45 8 * * *"

permissions:
  contents: read

concurrency:
  group: stegtvc-connectivity-autopatch
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block unresolved credential and mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::StegTVC connectivity autopatch is contained while its cross-repository credential boundary remains unresolved."
          echo "The replacement must obtain read/mutation authority through TV/TVC, preflight target scope, preserve exact actor/token provenance, and fail closed before any unauthorized mutation attempt."
          exit 1
