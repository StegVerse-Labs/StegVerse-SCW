name: Finance Credential Boundary Validation

on:
  pull_request:
    paths:
      - "finance/**"
      - "tests/test_finance_provider_credential_boundary.py"
      - "docs/SCW_FINANCE_PROVIDER_CREDENTIAL_BOUNDARY_MIRROR_HANDOFF.md"
      - ".github/workflows/finance-credential-boundary-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-finance-credential-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove checkout credential is not persisted
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "$(git config --local --get http.https://github.com/.extraheader || true)"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Install bounded validation dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate finance credential boundary
        run: python -m pytest -q tests/test_finance_provider_credential_boundary.py

      - name: Prove workflow is validation-only
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path(".github/workflows/finance-credential-boundary-validation.yml").read_text().splitlines()
          stripped = [line.strip() for line in lines]
          assert "contents: read" in stripped
          assert "persist-credentials: false" in stripped
          assert "contents: write" not in stripped
          assert not any(line.startswith("uses: actions/upload-artifact@") for line in stripped)
          assert not any(line.startswith(("git push", "git commit", "git tag")) for line in stripped)
          print("SCW_FINANCE_CREDENTIAL_BOUNDARY_VALIDATION_ONLY_PASS")
          PY
