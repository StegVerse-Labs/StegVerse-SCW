name: Test Readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve JSON validation scope
        id: json_scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.json' > "$RUNNER_TEMP/json-files.txt"
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          else
            find . -type f -name '*.json' -print > "$RUNNER_TEMP/json-files.txt"
            echo "mode=repository" >> "$GITHUB_OUTPUT"
          fi
      - name: Baseline repository smoke test
        env:
          JSON_FILE_LIST: ${{ runner.temp }}/json-files.txt
          JSON_SCOPE_MODE: ${{ steps.json_scope.outputs.mode }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import sys

          root = Path('.')
          failures = []
          skipped_parts = {
              '.git',
              '.mypy_cache',
              '.pytest_cache',
              '.ruff_cache',
              '.venv',
              'node_modules',
              'venv',
          }

          if not any((root / name).exists() for name in ('README.md', 'README.MD')):
              failures.append('missing README.md')

          workflows = root / '.github' / 'workflows'
          if workflows.exists():
              bad = sorted(p.name for p in workflows.glob('*.ym'))
              if bad:
                  failures.append(
                      'workflow files must end in .yml or .yaml: ' + ', '.join(bad)
                  )

          file_list = Path(os.environ['JSON_FILE_LIST'])
          candidates = []
          if file_list.exists():
              candidates = [Path(line) for line in file_list.read_text().splitlines() if line]

          for path in sorted(candidates):
              if not path.exists() or any(part in skipped_parts for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'invalid JSON: {path}: {exc}')

          print(f"JSON validation scope: {os.environ['JSON_SCOPE_MODE']}")
          print(f"JSON files examined: {len(candidates)}")

          tests = root / 'tests'
          if tests.exists():
              print(f'tests directory detected: {tests}')
          else:
              print('no tests directory detected; baseline smoke gate only')

          if failures:
              print('TEST READINESS FAILED')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)

          print('TEST READINESS PASSED')
          PY
