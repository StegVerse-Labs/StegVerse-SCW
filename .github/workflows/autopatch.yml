name: StegVerse Autopatch [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy mutation authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy autopatch path is contained because it previously used PAT/GitHub credential fallbacks and direct cross-repository mutation outside the bounded TV/TVC authority model."
          echo "A replacement must execute through admitted TV/TVC authority, preserve exact actor/token provenance, and emit only non-secret evidence."
          exit 1
