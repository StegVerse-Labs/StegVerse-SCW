name: Workflow Preflight (Validate & Fix)

on:
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: Apply fixes in-place; false performs a read-only report
        required: false
        default: false
        type: boolean
      auto_commit:
        description: Commit normalized workflows when apply_fixes is true
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/trigger/preflight/**"

permissions:
  contents: write

concurrency:
  group: workflow-preflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tools
        run: |
          set -euo pipefail
          python3 -V
          jq --version

      - name: Seed fallback validator if missing
        run: |
          set -euo pipefail
          mkdir -p scripts self_healing_out
          if [ ! -f scripts/validate_and_fix.py ]; then
            cat > scripts/validate_and_fix.py <<'PY'
          #!/usr/bin/env python3
          import json
          import sys
          from pathlib import Path

          root = Path(__file__).resolve().parents[1]
          workflows = root / ".github" / "workflows"
          output = root / "self_healing_out"
          output.mkdir(parents=True, exist_ok=True)
          files = sorted(path.as_posix() for path in workflows.glob("*.y*ml"))
          applied = "--apply" in sys.argv
          summary = {
              "files": len(files),
              "changed": 0,
              "invalid_before": 0,
              "invalid_after": 0,
              "applied": applied,
              "note": "fallback inventory only; real validator not installed",
          }
          results = [
              {
                  "path": path,
                  "changed": False,
                  "before_valid": None,
                  "after_valid": None,
                  "classification": "unvalidated",
              }
              for path in files
          ]
          (output / "WORKFLOW_FIX_REPORT.json").write_text(
              json.dumps({"summary": summary, "results": results}, indent=2) + "\n",
              encoding="utf-8",
          )
          (output / "WORKFLOW_FIX_REPORT.md").write_text(
              "# Workflow Preflight Report\n\n"
              "- Fallback inventory executed; no YAML validity claim was made.\n"
              f"- Top-level workflow files found: **{len(files)}**\n"
              f"- Apply requested: **{applied}**\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2))
          PY
            chmod +x scripts/validate_and_fix.py
          fi

      - name: Validate workflows
        env:
          APPLY_FIXES: ${{ inputs.apply_fixes || false }}
        run: |
          set -euo pipefail
          if [ "$APPLY_FIXES" = "true" ]; then
            python3 scripts/validate_and_fix.py --apply
          else
            python3 scripts/validate_and_fix.py
          fi

      - name: Commit fixed workflows
        if: ${{ inputs.apply_fixes == true && inputs.auto_commit == true }}
        run: |
          set -euo pipefail
          git config user.name "workflow-fix-bot"
          git config user.email "bot@stegverse.local"
          git add .github/workflows scripts/validate_and_fix.py
          if git diff --cached --quiet; then
            echo "No workflow changes to commit."
          else
            git commit -m "chore: normalize workflows"
            git push origin HEAD:main
          fi

      - name: Ensure report files
        if: always()
        run: |
          set -euo pipefail
          mkdir -p self_healing_out
          if [ ! -f self_healing_out/WORKFLOW_FIX_REPORT.md ]; then
            printf '# Workflow Preflight Report\n\nValidator failed before producing a report.\n' > self_healing_out/WORKFLOW_FIX_REPORT.md
          fi
          find .github/workflows -maxdepth 2 -type f -print | sort > self_healing_out/TREE_WORKFLOWS.txt

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-preflight-report
          path: self_healing_out/**
          if-no-files-found: error
          retention-days: 14

  telemetry:
    needs: preflight
    if: always()
    uses: ./.github/workflows/telemetry-reusable.yml
    with:
      basename: preflight
      status: ${{ needs.preflight.result }}
