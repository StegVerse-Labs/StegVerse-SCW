name: Kick StegVerse Autopatch [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block retired credential dispatcher
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This dispatcher is contained because the prior path copied a generic PAT into GitHub step outputs and dispatched a now-retired autopatch workflow."
          echo "Use bounded TV/TVC execution only. See SCW issues #22 and #23."
          exit 1
