name: StegVerse Multi-Repo Autopatch (Legacy) [RETIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy credential path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Legacy multi-autopatch is retired. Do not re-enable PAT fallback or cross-repository mutation outside bounded TV/TVC authority."
          echo "See SCW issue #22."
          exit 1
