name: Repair bad workflow YAML (reviewed one-shot)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only; choose false only after reviewing the inventory"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: repair-bad-yaml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Run bounded YAML repair pass
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--dir ".github/workflows")
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/patches/repair_workflow_yaml.py "${args[@]}"

      - name: Commit repaired files
        if: ${{ inputs.dry_run == false && hashFiles('self_healing_out/YAML_REPAIR_CHANGED') != '' }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .github/workflows/*.yml .github/workflows/*.yaml
          if git diff --cached --quiet; then
            echo "No reviewed changes staged."
            exit 0
          fi
          git fetch origin "${GITHUB_REF_NAME:-main}"
          git rebase "origin/${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Summary
        if: always()
        run: |
          echo "### Bad YAML Repair Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: \`${{ inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f self_healing_out/YAML_REPAIR_REPORT.md ]; then
            cat self_healing_out/YAML_REPAIR_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report generated._" >> "$GITHUB_STEP_SUMMARY"
          fi
