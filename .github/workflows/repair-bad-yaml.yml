name: Repair Bad Workflow YAML (reviewed and bounded)

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: "Optional top-level workflow filename; blank reports all workflows"
        required: false
        default: ""
        type: string
      apply_safe_normalization:
        description: "Apply only line-ending, trailing-space, and final-newline normalization"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: repair-bad-yaml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Run bounded YAML inspection or safe normalization
        env:
          TARGET_FILE: ${{ inputs.target_file }}
          APPLY: ${{ inputs.apply_safe_normalization }}
        run: |
          set -euo pipefail
          args=(--dir ".github/workflows")
          if [ -n "$TARGET_FILE" ]; then
            args+=(--file "$TARGET_FILE")
          fi
          if [ "$APPLY" = "true" ]; then
            if [ -z "$TARGET_FILE" ]; then
              echo "::error title=Target required::Applying normalization requires one reviewed target_file."
              exit 2
            fi
            args+=(--apply)
          fi
          python scripts/patches/repair_workflow_yaml.py "${args[@]}"

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaml-repair-report
          path: |
            self_healing_out/YAML_REPAIR_REPORT.md
            self_healing_out/YAML_REPAIR_REPORT.json
          if-no-files-found: warn

      - name: Commit reviewed safe normalization
        if: ${{ inputs.apply_safe_normalization == true && hashFiles('self_healing_out/YAML_REPAIR_CHANGED') != '' }}
        env:
          TARGET_FILE: ${{ inputs.target_file }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -- ".github/workflows/$TARGET_FILE"
          if git diff --cached --quiet; then
            echo "No safe normalization changes staged."
            exit 0
          fi
          git fetch origin "${GITHUB_REF_NAME:-main}"
          git rebase "origin/${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Summary
        if: always()
        run: |
          echo "### Bounded YAML Repair Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ inputs.target_file || 'all workflows (report only)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Safe normalization requested: \`${{ inputs.apply_safe_normalization }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f self_healing_out/YAML_REPAIR_REPORT.md ]; then
            cat self_healing_out/YAML_REPAIR_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report generated._" >> "$GITHUB_STEP_SUMMARY"
          fi
