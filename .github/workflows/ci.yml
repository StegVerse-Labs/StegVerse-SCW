name: CI

on:
  push:
    paths: ["api/**", "scripts/**", "tests/**", ".github/workflows/ci.yml"]
  pull_request: {}
  workflow_dispatch:

permissions: read-all

jobs:
  lint_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.5 pytest==8.3.2
      - name: Resolve lint targets
        id: lint_targets
        run: |
          targets=""
          for path in api scripts tests; do
            if [ -d "$path" ]; then
              targets="$targets $path"
            fi
          done
          if [ -z "$targets" ]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "targets=$targets" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint (ruff)
        if: steps.lint_targets.outputs.targets != ''
        run: ruff check ${{ steps.lint_targets.outputs.targets }}
      - name: Skip lint when no Python paths exist
        if: steps.lint_targets.outputs.targets == ''
        run: echo "No Python lint targets detected."
      - name: Tests (pytest)
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' | grep -q .; then
            pytest -q
          else
            echo "No pytest tests detected; CI lint gate passed."
          fi
