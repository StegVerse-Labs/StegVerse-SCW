name: SCW - Workflow Runnability Audit [CONTAINED — CREDENTIAL PATH]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy credential-backed cross-repository receipt append
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This workflow is contained because the prior path passed a generic non-TV/TVC credential into a local action for cross-repository StegDB mutation."
          echo "The local runnability analysis may be reintroduced as evidence-only; any durable cross-repository receipt append requires separately admitted TV/TVC mutation authority. See SCW issue #22."
          exit 1
