name: Validate Setup Common Python

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-common-python/action.yml"
      - ".github/workflows/setup-common-python.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate composite action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup-common-python action
        uses: ./.github/actions/setup-common-python
        with:
          python-version: "3.11"
          cache: ""
          ensure-pyyaml: "true"
          extra-packages: "requests"

      - name: Verify runtime imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import requests
          import yaml

          print(f"python={sys.version.split()[0]}")
          print(f"requests={requests.__version__}")
          print(f"pyyaml={yaml.__version__}")
          PY
