# Historical bridge-forwarding entrypoint retained as validation-only transport.
name: StegVerse AI Bridge Forwarding - Validation Only

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate TVC bridge transport boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/forward-to-bridge.yml")
          text = path.read_text(encoding="utf-8")
          stripped = [line.strip() for line in text.splitlines() if not line.lstrip().startswith("#")]

          secret_expr = "$" + "{{ " + "secrets."
          gh_api = "gh " + "api"
          gh_auth = "gh " + "auth"
          dispatch_endpoint = "/" + "dispatches"
          dispatch_event = "event_" + "type="

          assert "contents: read" in stripped
          assert "persist-credentials: false" in stripped
          assert secret_expr not in text
          assert gh_api not in text
          assert gh_auth not in text
          assert dispatch_endpoint not in text
          assert dispatch_event not in text
          assert "TVC_ADMITTED_TRANSPORT_REQUIRED" in text
          print("SCW_AI_BRIDGE_HOSTED_DISPATCH_RETIRED_PASS")
          PY

      - name: Report canonical continuation
        run: |
          echo "state=TVC_ADMITTED_TRANSPORT_REQUIRED"
          echo "github_actions_role=VALIDATION_TRANSPORT_ONLY"
          echo "cross_repo_bridge_forward_performed=false"
          echo "credential_authority=TV/TVC"
          echo "authority_effect=NONE"
