# .github/workflows/forward-to-bridge.yml
name: Forward PR to StegVerse AI Bridge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Call repository_dispatch on bridge
        env:
          GH_TOKEN: ${{ secrets.GH_STEGVERSE_AI_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_STEGVERSE_AI_TOKEN is unavailable; skipping optional bridge dispatch."
            exit 0
          fi

          if ! gh api repos/StegVerse-Labs/hybrid-collab-bridge/dispatches \
            -X POST \
            -F event_type="stegverse-ai-review" \
            -F client_payload="{\"target_repo\":\"${GITHUB_REPOSITORY}\",\"pr_number\":${{ github.event.pull_request.number }}}"; then
            echo "::warning::Bridge dispatch failed. Credential repair is required outside this PR."
            exit 0
          fi

          echo "Bridge dispatch accepted."
