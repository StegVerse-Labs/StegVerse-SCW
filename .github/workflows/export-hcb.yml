name: export-hcb — CONTAINED

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy credential-bearing export authority
        run: |
          set -euo pipefail
          test -z "${STEGVERSE_BOT_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          echo "::error::Legacy HCB export is contained because it used non-TV/TVC credentials for cross-repository clone/create/push/tag/release authority."
          echo "Replacement requires explicit TV/TVC target-scoped source-read and mutation grants with exact source/target refs and secret-free receipts."
          exit 1
