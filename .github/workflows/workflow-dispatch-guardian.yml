name: Workflow Dispatch Guardian

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Inspect workflow dispatch coverage without mutation
        run: |
          set -euo pipefail
          mkdir -p workflow-guardian-evidence
          python - <<'PY'
          import json
          import pathlib
          import yaml

          wf_dir = pathlib.Path(".github/workflows")
          parse_failures = []
          missing_dispatch = []
          reusable_only = []
          valid = 0

          def to_map(value):
              if value is None:
                  return {}
              if isinstance(value, dict):
                  return value
              if isinstance(value, list):
                  return {item: {} for item in value if isinstance(item, str)}
              if isinstance(value, str):
                  return {value: {}}
              return {}

          for path in sorted(wf_dir.glob("*.y*ml")):
              text = path.read_text(encoding="utf-8", errors="replace")
              try:
                  data = yaml.safe_load(text)
              except Exception as exc:
                  parse_failures.append({
                      "path": path.as_posix(),
                      "error": f"{type(exc).__name__}: {str(exc).splitlines()[0]}",
                  })
                  continue

              if not isinstance(data, dict):
                  parse_failures.append({
                      "path": path.as_posix(),
                      "error": "invalid_workflow_shape",
                  })
                  continue

              valid += 1
              trigger_map = to_map(data.get("on", data.get(True)))
              if set(trigger_map) == {"workflow_call"}:
                  reusable_only.append(path.as_posix())
              elif "workflow_dispatch" not in trigger_map:
                  missing_dispatch.append(path.as_posix())

          evidence = {
              "valid_workflows": valid,
              "parse_failures": parse_failures,
              "missing_workflow_dispatch": missing_dispatch,
              "reusable_only": reusable_only,
              "state": "OBSERVED_NO_MUTATION",
              "github_runtime_authority": "VALIDATION_EVIDENCE_ONLY",
              "authority_effect": "NONE",
          }
          pathlib.Path("workflow-guardian-evidence/guardian.json").write_text(
              json.dumps(evidence, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "valid_workflows": valid,
              "parse_failures": len(parse_failures),
              "missing_workflow_dispatch": len(missing_dispatch),
              "reusable_only": len(reusable_only),
          }, indent=2))
          PY

      - name: Upload guardian evidence
        uses: actions/upload-artifact@v4
        with:
          name: workflow-dispatch-guardian-${{ github.run_id }}
          path: workflow-guardian-evidence/guardian.json
          if-no-files-found: error
          retention-days: 14
