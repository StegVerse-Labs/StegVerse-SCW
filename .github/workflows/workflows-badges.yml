name: Workflows Status Badges

on:
  workflow_dispatch: {}        # allows Run button + API trigger
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
      - ".github/docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Generate non-authorizing workflow status evidence
        run: |
          set -euo pipefail
          mkdir -p workflow-status-evidence
          python - <<'PY'
          import json
          import pathlib
          import yaml

          root = pathlib.Path(".github/workflows")
          records = []
          for path in sorted(root.glob("*.yml")) + sorted(root.glob("*.yaml")):
              text = path.read_text(encoding="utf-8", errors="replace")
              try:
                  doc = yaml.safe_load(text)
                  valid = isinstance(doc, dict)
                  error = None if valid else "invalid_workflow_shape"
              except Exception as exc:
                  valid = False
                  error = f"{type(exc).__name__}: {str(exc).splitlines()[0]}"
              records.append({"path": path.as_posix(), "valid": valid, "error": error})

          summary = {
              "total": len(records),
              "valid": sum(item["valid"] for item in records),
              "invalid": sum(not item["valid"] for item in records),
              "authority_effect": "NONE",
              "github_runtime_authority": "VALIDATION_EVIDENCE_ONLY",
          }
          out = {"summary": summary, "records": records}
          pathlib.Path("workflow-status-evidence/workflows-status.json").write_text(
              json.dumps(out, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload workflow status evidence
        uses: actions/upload-artifact@v4
        with:
          name: workflows-status-${{ github.run_id }}
          path: workflow-status-evidence/workflows-status.json
          if-no-files-found: error
          retention-days: 14
