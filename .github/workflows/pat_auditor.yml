name: StegVerse PAT Auditor [RETIRED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Block direct PAT credential inspection
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Legacy PAT auditor is retired because it directly consumed non-TV/TVC PAT credentials inside GitHub Actions and persisted reports from that execution."
          echo "Credential validation must occur inside TV/TVC authority and export only secret-free evidence. See SCW issue #22."
          exit 1
