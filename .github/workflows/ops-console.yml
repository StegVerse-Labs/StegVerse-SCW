name: Ops Console (reviewed control workflows)

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: "Reviewed control workflow"
        required: true
        default: "workflows-sanity-check.yml"
        type: choice
        options:
          - workflows-sanity-check.yml
          - setup-common-python.yml
          - workflow_preflight.yml
          - repair-bad-yaml.yml
      ref:
        description: "Existing Git ref to run on"
        required: true
        default: "main"
        type: string
      reason:
        description: "Operator reason recorded in the dispatch summary"
        required: true
        default: "control-plane validation"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ops-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate reviewed dispatch request
        id: validate
        shell: bash
        env:
          REQUESTED_WORKFLOW: ${{ inputs.workflow }}
          REQUESTED_REF: ${{ inputs.ref }}
          REQUEST_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          WF="$REQUESTED_WORKFLOW"
          REF="$REQUESTED_REF"
          REASON="$REQUEST_REASON"

          case "$WF" in
            workflows-sanity-check.yml|setup-common-python.yml|workflow_preflight.yml|repair-bad-yaml.yml)
              ;;
            *)
              echo "::error title=Workflow not reviewed::$WF is outside the control-nucleus allowlist."
              exit 1
              ;;
          esac

          if [ -z "$REF" ]; then
            echo "::error title=Missing ref::Provide an existing branch, tag, or commit ref."
            exit 1
          fi
          if [ -z "$REASON" ]; then
            echo "::error title=Missing reason::Provide an operator reason for this dispatch."
            exit 1
          fi

          TARGET=".github/workflows/$WF"
          if [ ! -f "$TARGET" ]; then
            echo "::error title=Workflow not found::$WF does not exist under .github/workflows."
            exit 1
          fi
          if ! grep -qE '^[[:space:]]*workflow_dispatch[[:space:]]*:' "$TARGET"; then
            echo "::error title=Not dispatchable::$WF does not declare workflow_dispatch."
            exit 1
          fi

          echo "workflow=$WF" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          {
            echo "### Reviewed dispatch request"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Workflow | \`$WF\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Actor | \`$GITHUB_ACTOR\` |"
            echo "| Reason | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch reviewed workflow with safe defaults
        uses: actions/github-script@v7
        env:
          TARGET_WORKFLOW: ${{ steps.validate.outputs.workflow }}
          TARGET_REF: ${{ steps.validate.outputs.ref }}
        with:
          script: |
            const workflow = process.env.TARGET_WORKFLOW;
            const ref = process.env.TARGET_REF;
            core.info(`Dispatching reviewed workflow ${workflow} on ${ref}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow,
              ref,
            });
            await core.summary
              .addHeading('Dispatch accepted')
              .addRaw(`GitHub accepted the dispatch request for \`${workflow}\` on \`${ref}\`.\n`)
              .addRaw('Execution success must be verified from the resulting workflow run.\n')
              .write();
