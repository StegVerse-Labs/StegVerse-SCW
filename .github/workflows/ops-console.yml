name: Ops Console (dispatch reviewed workflow)

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: "Top-level workflow filename in .github/workflows"
        required: true
        default: "workflows-sanity-check.yml"
      ref:
        description: "Existing Git ref to run on"
        required: true
        default: "main"

permissions:
  contents: read
  actions: write

concurrency:
  group: ops-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List manually dispatchable workflows
        shell: bash
        run: |
          set -euo pipefail
          echo "### Manually dispatchable workflows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | workflow_dispatch |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|:--:|" >> "$GITHUB_STEP_SUMMARY"
          found_any=false
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            found_any=true
            if grep -qE '^[[:space:]]*workflow_dispatch[[:space:]]*:' "$f"; then
              mark="✓"
            else
              mark="—"
            fi
            echo "| \`$(basename "$f")\` | $mark |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found_any" = false ]; then
            echo "_No top-level workflow files found._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate dispatch request
        id: validate
        shell: bash
        env:
          REQUESTED_WORKFLOW: ${{ inputs.workflow }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          WF="${REQUESTED_WORKFLOW}"
          REF="${REQUESTED_REF}"

          if [ -z "$WF" ] || [ "$(basename "$WF")" != "$WF" ]; then
            echo "::error title=Invalid workflow::Provide one top-level workflow filename without path components."
            exit 1
          fi
          case "$WF" in
            *.yml|*.yaml) ;;
            *)
              echo "::error title=Invalid workflow::Workflow filename must end in .yml or .yaml."
              exit 1
              ;;
          esac

          TARGET=".github/workflows/$WF"
          if [ ! -f "$TARGET" ]; then
            echo "::error title=Workflow not found::$WF does not exist under .github/workflows."
            exit 1
          fi
          if ! grep -qE '^[[:space:]]*workflow_dispatch[[:space:]]*:' "$TARGET"; then
            echo "::error title=Not dispatchable::$WF does not declare workflow_dispatch and cannot be dispatched through this console."
            exit 1
          fi
          if [ -z "$REF" ]; then
            echo "::error title=Missing ref::Provide an existing branch, tag, or commit ref."
            exit 1
          fi

          echo "workflow=$WF" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Dispatch target workflow
        uses: actions/github-script@v7
        env:
          TARGET_WORKFLOW: ${{ steps.validate.outputs.workflow }}
          TARGET_REF: ${{ steps.validate.outputs.ref }}
        with:
          script: |
            const workflow = process.env.TARGET_WORKFLOW;
            const ref = process.env.TARGET_REF;
            core.info(`Dispatching ${workflow} on ref ${ref}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow,
              ref,
            });
            await core.summary
              .addHeading('Dispatch created')
              .addTable([
                [{ data: 'workflow', header: true }, { data: 'ref', header: true }],
                [workflow, ref],
              ])
              .write();
