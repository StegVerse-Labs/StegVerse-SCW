name: Backup Trigger Folders

on:
  push:
    paths:
      - ".github/trigger/**"
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BACKUP_OWNER: StegVerse
  BACKUP_REPO: StegVerse-Trigger-Backups
  BACKUP_SUBDIR: StegVerse-SCW

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare bundle of trigger folders
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d ".github/trigger" ]; then
            tar -czf out/trigger.tgz .github/trigger
          else
            echo "No .github/trigger directory in source."
            mkdir -p .github/trigger
            tar -czf out/trigger.tgz .github/trigger
          fi

      - name: Preflight backup destination
        id: preflight
        env:
          BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PAT:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Backup skipped: BACKUP_PAT is not configured."
            exit 0
          fi

          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${BACKUP_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${BACKUP_OWNER}/${BACKUP_REPO}")"

          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Backup skipped: destination unavailable (HTTP ${code})."
          fi

      - name: Checkout backup repo
        if: steps.preflight.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_OWNER }}/${{ env.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_PAT }}
          path: backup
          fetch-depth: 0

      - name: Unpack into backup subtree
        if: steps.preflight.outputs.available == 'true'
        run: |
          set -euo pipefail
          DEST="backup/${BACKUP_SUBDIR}"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          tar -xzf out/trigger.tgz -C "${DEST}"
          mkdir -p "${DEST}/_meta"
          jq -n --arg repo "${{ github.repository }}" \
                --arg sha "${{ github.sha }}" \
                --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{source:$repo, sha:$sha, mirrored_at:$time}' \
            > "${DEST}/_meta/manifest.json"

      - name: Commit and push backup
        if: steps.preflight.outputs.available == 'true'
        run: |
          set -euo pipefail
          cd backup
          git config user.name "trigger-backup-bot"
          git config user.email "bot@stegverse.local"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to mirror."
            exit 0
          fi
          git add -A
          git commit -m "mirror: update triggers from ${{ github.repository }}@${{ github.sha }}"
          git pull --rebase
          git push
