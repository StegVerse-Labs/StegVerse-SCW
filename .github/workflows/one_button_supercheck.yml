name: One-Button Supercheck (Read-Only)

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Optional API base URL, such as https://scw-api.onrender.com"
        required: false
        default: ""
      include_api_checks:
        description: "Run read-only API health checks"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: one-button-supercheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supercheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Build read-only repository and workflow inventory
        run: |
          set -euo pipefail
          mkdir -p self_healing_out
          python - <<'PY'
          from __future__ import annotations

          import json
          import pathlib
          from collections import Counter

          import yaml

          root = pathlib.Path(".")
          workflow_root = root / ".github" / "workflows"
          records = []

          workflow_paths = sorted(workflow_root.rglob("*.yml")) + sorted(workflow_root.rglob("*.yaml"))
          for path in workflow_paths:
              text = path.read_text(encoding="utf-8", errors="replace")
              record = {
                  "path": path.as_posix(),
                  "bytes": len(text.encode("utf-8")),
                  "lines": len(text.splitlines()),
                  "parse_valid": False,
                  "classification": "invalid_yaml",
                  "dispatchable": False,
                  "workflow_call": False,
                  "error": None,
              }
              try:
                  document = yaml.safe_load(text)
                  record["parse_valid"] = True
                  if not isinstance(document, dict):
                      record["classification"] = "invalid_workflow_shape"
                  else:
                      trigger = document.get("on", document.get(True))
                      jobs = document.get("jobs")
                      if path.parent != workflow_root:
                          record["classification"] = "nested_workflow_file"
                      elif not isinstance(jobs, dict) or not jobs:
                          record["classification"] = "missing_jobs"
                      else:
                          record["classification"] = "workflow"

                      if isinstance(trigger, str):
                          trigger_names = {trigger}
                      elif isinstance(trigger, list):
                          trigger_names = set(trigger)
                      elif isinstance(trigger, dict):
                          trigger_names = set(trigger)
                      else:
                          trigger_names = set()

                      record["dispatchable"] = "workflow_dispatch" in trigger_names
                      record["workflow_call"] = "workflow_call" in trigger_names
              except Exception as exc:
                  record["error"] = f"{type(exc).__name__}: {str(exc).splitlines()[0]}"
              records.append(record)

          classifications = Counter(record["classification"] for record in records)
          summary = {
              "workflow_files": len(records),
              "parse_valid": sum(record["parse_valid"] for record in records),
              "parse_invalid": sum(not record["parse_valid"] for record in records),
              "dispatchable": sum(record["dispatchable"] for record in records),
              "workflow_call": sum(record["workflow_call"] for record in records),
              "classifications": dict(sorted(classifications.items())),
              "repository_files": sum(1 for path in root.rglob("*") if path.is_file() and ".git" not in path.parts),
          }

          output = pathlib.Path("self_healing_out")
          (output / "SUPERCHECK_INVENTORY.json").write_text(
              json.dumps({"summary": summary, "records": records}, indent=2) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# One-Button Supercheck Inventory",
              "",
              f"- Workflow files: **{summary['workflow_files']}**",
              f"- Parse-valid: **{summary['parse_valid']}**",
              f"- Parse-invalid: **{summary['parse_invalid']}**",
              f"- Dispatchable: **{summary['dispatchable']}**",
              f"- Reusable: **{summary['workflow_call']}**",
              f"- Repository files: **{summary['repository_files']}**",
              "",
              "## Classifications",
              "",
          ]
          lines.extend(f"- `{name}`: **{count}**" for name, count in summary["classifications"].items())

          invalid = [record for record in records if not record["parse_valid"]]
          if invalid:
              lines.extend(["", "## Parse failures", ""])
              lines.extend(f"- `{record['path']}` — {record['error']}" for record in invalid)

          nested = [record for record in records if record["classification"] == "nested_workflow_file"]
          if nested:
              lines.extend(["", "## Nested workflow files", ""])
              lines.extend(f"- `{record['path']}`" for record in nested)

          (output / "SUPERCHECK_INVENTORY.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Run optional read-only API checks
        if: ${{ inputs.include_api_checks }}
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          set -euo pipefail
          mkdir -p self_healing_out
          if [ -z "${API_BASE}" ]; then
            echo '{"ok":false,"error":"api_base is required when include_api_checks is true"}' > self_healing_out/SUPERCHECK_API.json
            exit 1
          fi

          base="${API_BASE%/}"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["API_BASE"].rstrip("/")
          paths = [
              "/v1/ops/health",
              "/v1/ops/env/required",
              "/v1/ops/config/status",
          ]
          results = []
          all_ok = True

          for path in paths:
              url = base + path
              try:
                  request = urllib.request.Request(url, method="GET", headers={"User-Agent": "SCW-ReadOnly-Supercheck"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(200000).decode("utf-8", errors="replace")
                      status = response.status
                  ok = 200 <= status < 300
                  results.append({"path": path, "status": status, "ok": ok, "body": body})
                  all_ok = all_ok and ok
              except urllib.error.HTTPError as exc:
                  body = exc.read(200000).decode("utf-8", errors="replace")
                  results.append({"path": path, "status": exc.code, "ok": False, "body": body})
                  all_ok = False
              except Exception as exc:
                  results.append({"path": path, "status": None, "ok": False, "error": f"{type(exc).__name__}: {exc}"})
                  all_ok = False

          payload = {"api_base": base, "ok": all_ok, "results": results}
          with open("self_healing_out/SUPERCHECK_API.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          print(json.dumps(payload, indent=2))
          if not all_ok:
              raise SystemExit(1)
          PY

      - name: Publish job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f self_healing_out/SUPERCHECK_INVENTORY.md ]; then
            cat self_healing_out/SUPERCHECK_INVENTORY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f self_healing_out/SUPERCHECK_API.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## API diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat self_healing_out/SUPERCHECK_API.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload supercheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-button-supercheck-read-only
          path: |
            self_healing_out/SUPERCHECK_INVENTORY.json
            self_healing_out/SUPERCHECK_INVENTORY.md
            self_healing_out/SUPERCHECK_API.json
          if-no-files-found: error
          retention-days: 14

  telemetry:
    needs: [supercheck]
    if: always()
    permissions:
      contents: read
    uses: ./.github/workflows/telemetry-reusable.yml
    with:
      basename: supercheck
      status: ${{ needs.supercheck.result }}
