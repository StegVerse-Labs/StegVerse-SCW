name: Verify UI Layout

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check current Next.js UI source layout
        run: |
          set -euo pipefail
          for f in \
            ui/package.json \
            ui/next.config.js \
            ui/pages/index.js \
            ui/public/stegtalk.html \
            ui/public/manifest.json \
            ui/public/sw.js \
            README-LAYMAN.md \
            README-DEV.md
          do
            if [ ! -e "$f" ]; then
              echo "::error::Missing current UI source: $f"
              exit 1
            fi
            echo "Found: $f"
          done
          echo "Current Next.js UI source layout is present."

      - name: Record authority boundary
        run: |
          echo "github_runtime_authority=VALIDATION_EVIDENCE_ONLY"
          echo "deployment_authority=NONE"
          echo "authority_effect=NONE"
