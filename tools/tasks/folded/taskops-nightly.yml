name: taskops-nightly

on:
  schedule:
    - cron: "0 5 * * *"  # every day at 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install validation dependency
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Generate proposed AutoDocs outputs
        run: python scripts/autodocs_probe_pr_safe.py

      - name: Capture proposed changes
        shell: bash
        run: |
          set -euo pipefail
          git diff -- README.md .github/docs/ > taskops-proposed.patch
          if [ -s taskops-proposed.patch ]; then
            echo "TaskOps generated proposed documentation changes; publication is not authorized here."
          else
            echo "TaskOps generated no documentation delta."
          fi

      - name: Retain TaskOps validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: taskops-nightly-validation-${{ github.run_id }}
          path: |
            taskops-proposed.patch
            .github/docs/PR_SAFE_STATUS.md
            README.md
          if-no-files-found: error
          retention-days: 14
