name: StegVerse Guardian Worker – Repo Alignment Check [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block unresolved private-source authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Alignment check publication is contained because the prior workflow used PAT fallbacks, global GitHub credential rewriting, and direct report pushes."
          echo "Use TVC private-source-read authority for private repository materialization and a separately admitted mutation path for durable publication. See SCW issue #22."
          exit 1
