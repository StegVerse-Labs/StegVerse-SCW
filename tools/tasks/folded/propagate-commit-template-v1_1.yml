name: propagate-commit-template-v1_1 — CONTAINED

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy credential-bearing propagation
        run: |
          set -euo pipefail
          test -z "${STEGVERSE_BOT_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          echo "::error::Legacy v1.1 commit-template propagation is contained because it used non-TV/TVC bearer credentials for branch deletion/reset, cross-repository push, and PR creation."
          echo "Replacement requires explicit TV/TVC target-scoped mutation authority with exact source/target refs and secret-free receipts."
          exit 1
