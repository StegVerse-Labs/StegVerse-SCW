name: Seed Steg Config (self-healing) [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy credential bootstrap/export path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy workflow is contained because it could obtain an admin credential, write it to GitHub Actions outputs/files, and upload it as an artifact."
          echo "Credential issuance, storage, transport, and processing must remain inside the TV/TVC authority boundary and may emit only non-secret evidence."
          echo "External runtime bootstrap/config seeding must be replaced by a StegVerse-owned bounded execution path before reactivation."
          exit 1
