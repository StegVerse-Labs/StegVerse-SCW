name: StegVerse Guardian Worker – Repo Alignment Auto-Fixer [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy PAT-backed auto-fix
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Guardian alignment auto-fixer is contained because PAT fallback/global credential rewriting and direct pushes are outside admitted TV/TVC authority."
          echo "A replacement must bind exact source, decision, target, and repair authority before mutation. See SCW issue #22."
          exit 1
