name: StegVerse Guardian Worker – Workflows Health + Hygiene [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy workflow self-mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Workflow health/hygiene mutation is contained because the prior scheduled PAT-backed job could rewrite workflows and push them directly."
          echo "Health analysis may remain evidence-only; workflow mutation requires separately admitted TV/TVC repair authority. See SCW issue #22."
          exit 1
