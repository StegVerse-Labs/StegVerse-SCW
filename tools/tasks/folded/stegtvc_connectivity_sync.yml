name: StegTVC Connectivity Sync [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy connectivity sync authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::StegTVC connectivity sync is contained because the prior workflow used PAT fallback/global credential rewriting and cross-repository synchronization under GitHub-hosted authority."
          echo "Use the TVC private-source-read capability for exact read-only materialization and a separately admitted mutation capability for any writes. See SCW issue #22."
          exit 1
