name: StegVerse Guardian Worker - PAT Secrets Check [RETIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy PAT inventory authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Legacy PAT secret-inventory workflow is retired because the ecosystem credential contract is TV/TVC-only and the prior workflow published repository state from GitHub-hosted execution."
          echo "TV/TVC may emit a secret-free credential-health receipt instead. See SCW issue #22."
          exit 1
