name: StegVerse Org Cleanup Worker [RETIRED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Block direct generic credential validation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy worker is retired because it directly consumed and exercised a non-TV/TVC PAT against GitHub identity/access APIs."
          echo "Repository hygiene analysis may run credential-free; credential validation must remain inside TV/TVC and export only secret-free evidence. See SCW issue #22."
          exit 1
