name: StegVerse Guardian Worker – Repo Alignment Check [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy PAT-backed publication
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This duplicate alignment-check publication path is contained because it previously used PAT fallback and direct pushes."
          echo "Private source reads must use bounded TVC authority; durable publication requires separately admitted mutation authority. See SCW issue #22."
          exit 1
