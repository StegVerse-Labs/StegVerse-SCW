name: Backup Trigger Folders [VALIDATION ONLY]

on:
  push:
    paths:
      - ".github/trigger/**"
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trigger backup evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d ".github/trigger" ]; then
            tar -czf out/trigger.tgz .github/trigger
          else
            echo "No .github/trigger directory in source."
            mkdir -p .github/trigger
            tar -czf out/trigger.tgz .github/trigger
          fi

          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg event "${{ github.event_name }}" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema:"stegverse.scw.trigger-backup-evidence/v1",
              source:$repo,
              source_sha:$sha,
              workflow_run_id:$run_id,
              event:$event,
              generated_at:$time,
              authority_effect:"NONE_VALIDATION_EVIDENCE_ONLY",
              external_repository_mutation:false,
              publication:false
            }' > out/manifest.json

      - name: Retain trigger backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: trigger-backup-evidence
          path: |
            out/trigger.tgz
            out/manifest.json
          if-no-files-found: error
