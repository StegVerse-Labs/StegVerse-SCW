name: Log Revenue Event (manual) [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy revenue ledger mutation authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Manual revenue ledger mutation is contained because the prior workflow used PAT fallback and direct pushes to authoritative repository state."
          echo "Revenue events require an admitted TV/TVC or sovereign ledger mutation path with attributable authority and receipt evidence. See SCW issue #22."
          exit 1
