name: StegVerse SCW Bridge [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy cross-repository command dispatch
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::SCW bridge dispatch is contained because the prior path used a generic non-TV/TVC credential to dispatch commands across repository boundaries."
          echo "Command routing must use admitted TV/TVC route authority with exact caller, command, target, and non-secret receipt evidence. See SCW issue #22."
          exit 1
