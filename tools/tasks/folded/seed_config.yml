name: Seed Steg Config [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy external secret seeding path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy workflow is contained because it assembled multiple credential/deploy-hook values outside the bounded TV/TVC credential-processing authority and targeted external runtime configuration."
          echo "No secret value is required or consumed by this contained workflow."
          echo "Replacement execution must be StegVerse-owned, TV/TVC-governed, least-privilege, and emit only non-secret receipts."
          exit 1
