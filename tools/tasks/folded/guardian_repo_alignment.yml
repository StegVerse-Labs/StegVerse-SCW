name: StegVerse Guardian Worker – Repo Alignment [CONTAINED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy guardian mutation authority
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Legacy guardian repo-alignment mutation is contained because PAT fallback and direct push authority are not admitted TV/TVC execution."
          echo "Use bounded TVC private-source-read plus separately admitted repair authority. See SCW issue #22."
          exit 1
